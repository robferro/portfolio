<template>
    <article class="card">
        <header>
            <p class="meta">{project.context} · {project.years}</p>
            <h2>{project.title}</h2>
            <p class="role">{project.role}</p>
        </header>

        <p class="headline">{project.headline}</p>

        <ul class="tags">
            <template for:each={project.tags} for:item="tag">
                <li key={tag}>{tag}</li>
            </template>
        </ul>

        <template lwc:if={expanded}>
            <section class="details">
                <h3>Challenge</h3>
                <p>{project.challenge}</p>

                <h3>Approach</h3>
                <ul>
                    <template for:each={project.approach} for:item="step">
                        <li key={step}>{step}</li>
                    </template>
                </ul>

                <h3>Outcome</h3>
                <p>{project.outcome}</p>
            </section>
        </template>

        <button class="toggle" aria-expanded={ariaExpanded} onclick={handleToggle}>
            {toggleLabel}
        </button>
    </article>
</template>
