<template>
    <article class="card">
        <header>
            <p class="meta">{project.context} · {project.years} · {project.role}</p>
            <h2>{project.title}</h2>
        </header>

        <p class="headline">{project.headline}</p>

        <ul class="tags">
            <template for:each={project.tags} for:item="tag">
                <li key={tag}>{tag}</li>
            </template>
        </ul>

        <button class="open" aria-haspopup="dialog" onclick={openDialog}>
            Read case study →
        </button>
    </article>

    <!-- Case study dialog: native <dialog> gives backdrop, Esc-to-close and focus handling -->
    <dialog lwc:ref="dialog" class="dialog" aria-labelledby="dialog-title" onclick={handleBackdropClick} onclose={handleClose}>
        <div class="dialog-inner">
            <header class="dialog-header">
                <div>
                    <p class="meta">{project.context} · {project.years} · {project.role}</p>
                    <h2 id="dialog-title">{project.title}</h2>
                    <p class="headline">{project.headline}</p>
                </div>
                <button class="close" aria-label="Close case study" onclick={closeDialog}>✕</button>
            </header>

            <div class="dialog-body">
                <ul class="tags">
                    <template for:each={project.tags} for:item="tag">
                        <li key={tag}>{tag}</li>
                    </template>
                </ul>

                <h3>Challenge</h3>
                <p>{project.challenge}</p>

                <h3>Approach</h3>
                <ul class="approach">
                    <template for:each={project.approach} for:item="step">
                        <li key={step}>{step}</li>
                    </template>
                </ul>

                <h3>Outcome</h3>
                <p class="outcome">{project.outcome}</p>

                <template lwc:if={project.testimonials}>
                    <h3>What customers are saying</h3>
                    <template for:each={project.testimonials} for:item="quote">
                        <blockquote key={quote}>“{quote}”</blockquote>
                    </template>
                </template>
            </div>
        </div>
    </dialog>
</template>
